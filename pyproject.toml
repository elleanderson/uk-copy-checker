[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ukcopy"
version = "1.0.0"
description = "A house style checker for UK English: em dashes, Oxford commas, stranded prepositions, US spellings and AI-sounding phrases."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elle Anderson" }]
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]
keywords = ["style", "linter", "british-english", "copywriting", "writing", "content-design"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Linguistic",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ukcopy = "ukcopy.cli:main"

[project.urls]
Homepage = "https://andersonco.uk"
Source = "https://github.com/elleanderson/uk-copy-checker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
